services:
  gateway:
    build: ./backend
    restart: unless-stopped
    environment:
      JARVIS_ENVIRONMENT: production
      JARVIS_CORE_TOKEN: ${JARVIS_CORE_TOKEN:?JARVIS_CORE_TOKEN must be set in .env}
      JARVIS_CORS_ORIGINS: ${JARVIS_CORS_ORIGINS:-https://jarvis.charlydob.com}
      JARVIS_CORE_TIMEOUT_SECONDS: ${JARVIS_CORE_TIMEOUT_SECONDS:-180}
      JARVIS_MAX_AUDIO_BYTES: ${JARVIS_MAX_AUDIO_BYTES:-26214400}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ""
        VITE_WS_URL: "/ws"
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 3s
      retries: 5
